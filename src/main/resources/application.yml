server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: gorogoro-lxp

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: ${BATCH_SIZE}


  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: true

  # Spring Security (?? ??? ?? ?? ?? ? ?? ??)
  # security:
  #   user:
  #     name: user
  #     password: password

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.gorogoro: DEBUG

jwt:
  secret: ${JWT_SECRET_TOKEN}
  expiration-ms: ${ACCESS_TOKEN_EXPIRED}
  refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRED}
