server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: gorogoro-lxp

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: ${BATCH_SIZE}
  rabbitmq:
    host: ${RABBIT_HOST}
    port: 5672
    username: ${RABBIT_ID}
    password: ${RABBIT_PASSWORD}
    virtual-host: ${VHOST}

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: true

  # Spring Security (?? ??? ?? ?? ?? ? ?? ??)
  # security:
  #   user:
  #     name: user
  #     password: password

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.gorogoro: DEBUG

jwt:
  expiration-seconds: ${ACCESS_TOKEN_EXPIRED}
  refresh-expiration-seconds: ${REFRESH_TOKEN_EXPIRED}

rabbit:
  events:
    exchange: lxp.events
    routing-prefix: lxp.
    queues:
      user:
        name: user.events.q
        bindings:
          - lxp.user.created
          - lxp.user.verified
    dlq:
      dlx: lxp.events.dlx
      name: lxp.events.dlq
      routing: lxp.events.dlq
